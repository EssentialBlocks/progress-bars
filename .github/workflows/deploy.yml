# Deploy to WP.org
name: Deploy to WordPress.org

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    tags:
    - "*"
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
        with:
            submodules: recursive
            token: ${{ secrets.EB_PAT }}
      # node version
      #
      # Node 20 is the floor the resolved dependency tree requires: sass and its
      # chokidar dependency both declare `node >= 20.19.0`. Node 14 also ships
      # npm 6, whose flat hoisting cannot keep ajv 6 (eslint) and ajv 8
      # (webpack's schema-utils) side by side, so ajv-keywords@5 resolved against
      # ajv 6 and the build died on `Cannot find module 'ajv/dist/compile/codegen'`.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Runs a single command using the runners shell
      # - name: Git Submodule Cloning
      #   run: git submodule update --init --recursive
        # env:
        #   GITHUB_TOKEN: ${{ secrets.TOKEN }}
      - name: Running NPM Install & Build
        run: |
          npm ci
          npm run build
      - name: WordPress Plugin Deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
